name: "CERT-In CIAD-2026-0049 Readiness Checker"
description: >-
  Turn CERT-In critical advisory CIAD-2026-0049 (AI Agents as Attack Vectors) into a machine-checkable audit: scores 180-day tamper-resistant logs, dormant API retirement, secret rotation, least-privilege + MFA, and forensic clearance as pass/fail/unknown from a JSON evidence file. Fails CI when any demand fails. By Ingenious AI.
author: "Ingenious AI"

branding:
  icon: "clipboard"
  color: "green"

inputs:
  evidence:
    description: Path to the JSON evidence file, relative to the repository root.
    required: false
    default: ".certin-0049-evidence.json"
  fail-on-failure:
    description: "'true' (default): fail the build when any demand fails."
    required: false
    default: "true"

outputs:
  overall:
    description: Overall readiness verdict (PASS, PARTIAL, FAIL, UNKNOWN).
    value: ${{ steps.scan.outputs.overall }}
  failed-count:
    description: Number of failed demands.
    value: ${{ steps.scan.outputs.failed-count }}
  passed-count:
    description: Number of passed demands.
    value: ${{ steps.scan.outputs.passed-count }}

runs:
  using: "composite"
  steps:
    - name: Run CERT-In CIAD-2026-0049 Readiness Checker
      id: scan
      shell: bash
      run: |
        set -u
        export FAIL_ON_F="${{ inputs.fail-on-failure }}"
        python3 "${{ github.action_path }}/certin_0049_readiness_checker.py" --evidence "${{ github.workspace }}/${{ inputs.evidence }}" --json "$RUNNER_TEMP/scan-report.json" --markdown "$RUNNER_TEMP/scan-report.md" || true
        echo '' | base64 -d > "$RUNNER_TEMP/eval.py"
        python3 "$RUNNER_TEMP/eval.py"
    - name: Fail on findings
      shell: bash
      if: steps.scan.outputs.failed == 'true'
      run: |
        echo "::error::CERT-In CIAD-2026-0049 Readiness Checker reported findings above the fail threshold."
        exit 1
